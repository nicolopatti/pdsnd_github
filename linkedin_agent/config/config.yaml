  # Content pillars with relative weights (higher = more frequent)
  content_pillars:
    - name: "Guide pratiche ai bandi"
      weight: 3
    - name: "Novità e scadenze PNRR"
      weight: 3
    - name: "Casi studio: progetti finanziati"
      weight: 2
    - name: "Errori comuni nelle domande"
      weight: 2
    - name: "Strumenti e risorse utili"
      weight: 2
    - name: "Opportunità per il terzo settore"
      weight: 2
    - name: "Dati e tendenze sui finanziamenti europei"
      weight: 1

  # Content format types (value-first philosophy)
  content_formats:
    - name: "guida_pratica"
      description: "Come fare [X] in N passi — istruzioni azionabili"
      weight: 3
    - name: "risorsa"
      description: "N strumenti/risorse/link utili su un tema specifico"
      weight: 2
    - name: "sintesi_bando"
      description: "Scade il [data]: [bando] — requisiti chiave e per chi è"
      weight: 3
    - name: "caso_studio"
      description: "[Org X] ha ottenuto €Y con [programma] — ecco come"
      weight: 2
    - name: "errori_comuni"
      description: "N errori che fanno perdere punti / fanno rigettare le domande"
      weight: 2
    - name: "dato_sorprendente"
      description: "Statistica inaspettata come hook per una riflessione di valore"
      weight: 1
    - name: "checklist"
      description: "Lista di controllo prima di fare/inviare [X]"
      weight: 2

