# LinkedIn profiles of key voices to monitor (add URNs or public profile slugs)
influencers_to_monitor:
  profiles: []  # Example: ["riccardo-rossi-europrogettista", "maria-bianchi-eu-funds"]

activity:
  daily_limits:
    posts_per_week: 4           # Max posts per week; agent distributes across weekdays
    comments_per_day: 5         # Max comments per day
    reactions_per_day: 10       # Max "consiglia" or "diffondi" per day
    connection_requests_per_day: 10  # Conservative (LinkedIn soft limit ~20-25/day)
    profile_views_per_day: 20   # Triggers reciprocal views
  posting_window:
    start_hour: 8               # Don't post before 8am (Europe/Rome)
    end_hour: 18                # Don't post after 6pm
  best_days_to_post:            # Sorted by engagement for B2B niche
    - "Tuesday"
    - "Wednesday"
    - "Thursday"
  timezone: "Europe/Rome"

safety:
  min_delay_between_actions_seconds: 45   # Min sleep between LinkedIn actions
  max_delay_between_actions_seconds: 120  # Max sleep (random within range)
  session_max_actions: 15                  # Hard stop after N actions per session
  respect_weekends: true                   # No automation on Sat/Sun
  headless_browser: false                  # Set true to run browser without UI
